<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weiss Ops</title>
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Manifesto: a tela da TV (#/tv) instala como app em tela cheia; o resto do app como app normal.
      (function () {
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = location.hash.indexOf('#/tv') === 0 ? '/tv.webmanifest' : '/app.webmanifest';
        document.head.appendChild(l);
      })();
    </script>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash.
      try {
        var t = localStorage.getItem('spindleops:theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
